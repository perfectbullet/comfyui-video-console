# comfyui-video-console 前端 · 测试环境（231）
# 放置位置：/etc/nginx/conf.d/comfyui-video-console.conf
# 启用前先腾出 8600 端口（查占用：ss -lntp | grep 8600）
# 启用：sudo nginx -t && sudo nginx -s reload

server {
    listen 8600;
    server_name _;

    root  /data/aigc/comfyui-h3/comfyui-video-console;
    index index.html;

    client_max_body_size 200m;

    # 静态页面，SPA 兜底（刷新子路径不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代任务归档服务：页面里的 /api/... 全部走这里
    # 浏览器只跟 :8600 说话，不跨域、不 canvas 污染
    location /api/ {
        proxy_pass http://192.168.8.231:8610/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}

